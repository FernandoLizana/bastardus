[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pnp-research-lab"
version = "0.1.0"
description = "Rigorous, reproducible computational research platform for studying NP-complete problems and complexity conjectures. Never presents experimental evidence as a P vs NP resolution."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "PNP Research Laboratory Contributors" }]
keywords = ["complexity", "SAT", "NP-complete", "research", "reproducibility"]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "matplotlib>=3.9.0",
    "networkx>=3.3",
    "python-sat>=1.8.dev",
    "psutil>=6.0.0",
    "structlog>=24.4.0",
    "typer>=0.12.0",
    "rich>=13.9.0",
    "pyarrow>=17.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "hypothesis>=6.112.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "pre-commit>=4.0.0",
    "httpx>=0.27.0",
]
science = [
    "scipy>=1.14.0",
    "sympy>=1.13.0",
    "z3-solver>=4.13.0",
    "ortools>=9.10.0",
    "duckdb>=1.1.0",
]

[project.scripts]
pnp-lab = "backend.experiments.run:app"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"
markers = [
    "slow: long-running experiments",
    "integration: cross-module integration tests",
]

[tool.coverage.run]
source = ["backend"]
omit = ["backend/tests/*", "backend/api/*"]

[tool.coverage.report]
fail_under = 85
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
packages = ["backend"]

[tool.black]
line-length = 100
target-version = ["py311"]
